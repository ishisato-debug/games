<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲームあそび</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(180deg, #8fd3ff 0%, #c9ecff 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .app { width: 100%; max-width: 520px; }
  h1 { text-align: center; color: #1d3a5c; font-size: 28px; margin: 8px 0 24px; }
  .list { display: grid; gap: 18px; }
  .card {
    display: flex; align-items: center; gap: 16px; padding: 18px 20px;
    background: linear-gradient(180deg, #ffe066 0%, #ffc919 100%);
    box-shadow: 0 6px 0 #c99400, 0 8px 14px rgba(0, 0, 0, .18);
    border-radius: 20px; text-decoration: none; color: #4a3500;
    transition: transform .06s, box-shadow .06s;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99400, 0 3px 6px rgba(0, 0, 0, .18); }
  .card .icon { font-size: 56px; line-height: 1; }
  .card .name { font-size: 24px; font-weight: 800; }
  .card .desc { font-size: 14px; margin-top: 2px; opacity: .8; }
</style>
</head>
<body>
<div class="app">
  <h1>🎮 ゲームあそび</h1>
  <div class="list">
    <a class="card" href="run/">
      <div class="icon">🐰</div>
      <div><div class="name">シナモンダッシュ</div><div class="desc">タップでジャンプ！くだものをあつめよう</div></div>
    </a>
    <a class="card" href="mogura/">
      <div class="icon">🐹</div>
      <div><div class="name">もぐらたたき</div><div class="desc">でてきたもぐらをタッチ！</div></div>
    </a>
    <a class="card" href="touch-numbers/">
      <div class="icon">🔢</div>
      <div><div class="name">Touch the Numbers</div><div class="desc">1から25まで じゅんばんにタッチ</div></div>
    </a>
  </div>
</div>
</body>
</html>
